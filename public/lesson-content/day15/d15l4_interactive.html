<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f8fb;color:#172033}main{width:1280px;height:720px;padding:48px}h1{font-size:40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}button{min-height:190px;border:1px solid #dbe2ea;background:white;border-radius:22px;padding:24px;font-size:22px;text-align:left;cursor:pointer}#out{margin-top:28px;background:#111827;color:white;border-radius:22px;padding:26px;font-size:22px;min-height:150px}@media(max-width:900px){main{width:100%;height:auto;padding:22px}.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>AI 창업 포트폴리오와 서비스 브랜딩 정리 — 판단 연습</h1><div class="grid"><button onclick="show(0)"><b>근거 있음</b><br><small>확인 가능한 자료·계산·제품 화면·실제 기록을 사용합니다.</small></button><button onclick="show(1)"><b>가설</b><br><small>아직 확인되지 않은 기대·추정·계획은 가설로 표시합니다.</small></button><button onclick="show(2)"><b>검증 필요</b><br><small>숫자·시장·성과·정책처럼 불확실한 내용은 확인 전까지 확정</small></button></div><div id="out">카드를 눌러 설명을 확인하세요.</div></main>
<script>const d=[["근거 있음", "확인 가능한 자료·계산·제품 화면·실제 기록을 사용합니다."], ["가설", "아직 확인되지 않은 기대·추정·계획은 가설로 표시합니다."], ["검증 필요", "숫자·시장·성과·정책처럼 불확실한 내용은 확인 전까지 확정 표현을 피합니다."]];function show(i){document.getElementById('out').textContent=d[i][0]+' — '+d[i][1];}</script></body></html>
