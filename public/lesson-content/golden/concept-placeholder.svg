<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="증거 태그 3단계">
  <rect width="800" height="600" fill="#F8FAFC"/>
  <g font-family="system-ui, sans-serif">
    <text x="50" y="70" fill="#0F172A" font-size="34" font-weight="800">증거 태그 3단계</text>

    <g transform="translate(50,120)">
      <rect width="700" height="130" rx="18" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
      <circle cx="55" cy="65" r="24" fill="#D1FAE5"/>
      <text x="55" y="74" fill="#065F46" font-size="24" font-weight="800" text-anchor="middle">1</text>
      <text x="105" y="55" fill="#065F46" font-size="24" font-weight="800">근거 있음</text>
      <text x="105" y="92" fill="#475569" font-size="19">고객 원문에서 직접 확인되는 내용</text>
    </g>

    <g transform="translate(50,275)">
      <rect width="700" height="130" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="55" cy="65" r="24" fill="#FEF3C7"/>
      <text x="55" y="74" fill="#92400E" font-size="24" font-weight="800" text-anchor="middle">2</text>
      <text x="105" y="55" fill="#92400E" font-size="24" font-weight="800">추론</text>
      <text x="105" y="92" fill="#475569" font-size="19">여러 원문을 종합하면 가능성이 있는 내용</text>
    </g>

    <g transform="translate(50,430)">
      <rect width="700" height="130" rx="18" fill="#FFFFFF" stroke="#F43F5E" stroke-width="3"/>
      <circle cx="55" cy="65" r="24" fill="#FFE4E6"/>
      <text x="55" y="74" fill="#9F1239" font-size="24" font-weight="800" text-anchor="middle">3</text>
      <text x="105" y="55" fill="#9F1239" font-size="24" font-weight="800">검증 필요</text>
      <text x="105" y="92" fill="#475569" font-size="19">원문에 없고 AI가 만들어낸 내용</text>
    </g>
  </g>
</svg>
