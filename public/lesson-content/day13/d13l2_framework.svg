<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f7f8fb"/>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#172033">고객·구매 담당자 질문 대응</text>
<text x="55" y="140" font-family="Arial,sans-serif" font-size="20" fill="#667085">핵심 구조를 한눈에 정리합니다.</text>
<g font-family="Arial,sans-serif"><rect x="55" y="220" width="260" height="330" rx="22" fill="#fff" stroke="#d9e0ea"/><text x="75" y="270" font-size="22" font-weight="700" fill="#172033">입력</text><text x="75" y="315" font-size="17" fill="#536079">기존 자료와 실제 확인 가능한</text><text x="75" y="349" font-size="17" fill="#536079">정보</text><rect x="347" y="220" width="260" height="330" rx="22" fill="#fff" stroke="#d9e0ea"/><text x="367" y="270" font-size="22" font-weight="700" fill="#172033">판단</text><text x="367" y="315" font-size="17" fill="#536079">사실·가설·검증 필요를 분리</text><rect x="639" y="220" width="260" height="330" rx="22" fill="#fff" stroke="#d9e0ea"/><text x="659" y="270" font-size="22" font-weight="700" fill="#172033">산출물</text><text x="659" y="315" font-size="17" fill="#536079">다음 단계에서 재사용할 결과물</text><rect x="931" y="220" width="260" height="330" rx="22" fill="#fff" stroke="#d9e0ea"/><text x="951" y="270" font-size="22" font-weight="700" fill="#172033">검수</text><text x="951" y="315" font-size="17" fill="#536079">과장·모순·개인정보를 확인</text></g></svg>