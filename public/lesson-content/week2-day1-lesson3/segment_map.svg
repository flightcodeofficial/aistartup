<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" rx="28" fill="#08111f"/>
<text x="64" y="76" fill="#f8fafc" font-family="Arial,sans-serif" font-size="36" font-weight="700">반복 패턴을 세그먼트 후보로 묶기</text>
<text x="64" y="116" fill="#9fb0c7" font-family="Arial,sans-serif" font-size="19">인구통계보다 문제 · 상황 · 행동 · 현재 대안을 먼저 봅니다.</text>
<rect x="70" y="170" width="1140" height="95" rx="20" fill="#0f1b2d" stroke="#2b3c55"/>
<text x="110" y="228" fill="#dbeafe" font-family="Arial,sans-serif" font-size="24" font-weight="700">Lesson2 고객 증거 → 반복 문제 → 촉발 사건 → 현재 대안 → 반증</text>
<rect x="70" y="320" width="350" height="250" rx="24" fill="#eff6ff"/>
<rect x="465" y="320" width="350" height="250" rx="24" fill="#f5f3ff"/>
<rect x="860" y="320" width="350" height="250" rx="24" fill="#ecfdf5"/>
<text x="100" y="365" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="21" font-weight="700">세그먼트 A</text>
<text x="100" y="408" fill="#0f172a" font-family="Arial,sans-serif" font-size="21" font-weight="700">마감 직전 문제가 급해지는 고객</text>
<text x="100" y="454" fill="#475569" font-family="Arial,sans-serif" font-size="16">촉발: 월말·행사 전날</text>
<text x="100" y="486" fill="#475569" font-family="Arial,sans-serif" font-size="16">대안: 수작업·급한 템플릿</text>
<text x="100" y="518" fill="#475569" font-family="Arial,sans-serif" font-size="16">근거 번호와 반증을 함께 기록</text>
<text x="495" y="365" fill="#7c3aed" font-family="Arial,sans-serif" font-size="21" font-weight="700">세그먼트 B</text>
<text x="495" y="408" fill="#0f172a" font-family="Arial,sans-serif" font-size="21" font-weight="700">수정 커뮤니케이션이 반복되는 고객</text>
<text x="495" y="454" fill="#475569" font-family="Arial,sans-serif" font-size="16">문제: 외주 수정 반복</text>
<text x="495" y="486" fill="#475569" font-family="Arial,sans-serif" font-size="16">대안: 외주 + 직접 재작업</text>
<text x="495" y="518" fill="#475569" font-family="Arial,sans-serif" font-size="16">예외·반증을 같이 유지</text>
<text x="890" y="365" fill="#059669" font-family="Arial,sans-serif" font-size="21" font-weight="700">세그먼트 C</text>
<text x="890" y="408" fill="#0f172a" font-family="Arial,sans-serif" font-size="21" font-weight="700">학습 부담 때문에 변경을 미루는 고객</text>
<text x="890" y="454" fill="#475569" font-family="Arial,sans-serif" font-size="16">반대 이유: 새 툴 학습</text>
<text x="890" y="486" fill="#475569" font-family="Arial,sans-serif" font-size="16">대안: 기존 방식 유지</text>
<text x="890" y="518" fill="#475569" font-family="Arial,sans-serif" font-size="16">실제 반복 여부는 추가 검증</text>
<rect x="70" y="625" width="1140" height="42" rx="14" fill="#172554"/>
<text x="640" y="652" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18" font-weight="700">세그먼트 이름보다 근거와 반증으로 돌아갈 수 있는 구조가 중요합니다.</text>
</svg>