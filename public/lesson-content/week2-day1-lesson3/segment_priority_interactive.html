<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>세그먼트 우선순위</title>
<style>*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;background:linear-gradient(135deg,#07111f,#14213d);font-family:Arial,sans-serif;color:#f8fafc;overflow:hidden}.w{padding:42px 50px}.h{font-size:34px;font-weight:700}.sub{color:#9fb0c7;margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.c{background:#0f1b2d;border:1px solid #2a3a52;border-radius:22px;padding:22px}.c h2{font-size:22px;margin:0 0 16px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #25364f}.row span{color:#dbe4ef}.row button{margin-left:5px;border:1px solid #405471;background:#132239;color:#fff;border-radius:9px;padding:6px 8px;cursor:pointer}.row button.sel{background:#1d4ed8;border-color:#60a5fa}.result{margin-top:22px;background:#0b1525;border:1px solid #2a3a52;border-radius:16px;padding:16px 20px;color:#cbd5e1}.result b{color:#93c5fd}</style></head>
<body><div class="w"><div class="h">어느 세그먼트를 먼저 검증할까요?</div><div class="sub">점수 자체가 아니라 증거 강도 · 문제 강도 · 현재 대안 · 접근 가능성을 비교하는 연습입니다.</div><div class="grid" id="g"></div><div class="result" id="r">모든 항목을 선택하면 우선 후보가 표시됩니다.</div></div>
<script>
const s=[["A · 마감 직전 급해지는 고객"],["B · 수정 반복 고객"],["C · 학습 부담 고객"]],k=["증거 강도","문제 강도","현재 대안","접근 가능성"],v=["낮음","중간","높음"],a={};const g=document.getElementById("g"),r=document.getElementById("r");
s.forEach((x,i)=>{let c=document.createElement("div");c.className="c";c.innerHTML="<h2>"+x[0]+"</h2>";k.forEach((q,j)=>{let row=document.createElement("div");row.className="row";let t=document.createElement("span");t.textContent=q;let d=document.createElement("div");v.forEach(z=>{let b=document.createElement("button");b.textContent=z;b.onclick=()=>{a[i]??={};a[i][j]=z;[...d.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");check()};d.appendChild(b)});row.append(t,d);c.appendChild(row)});g.appendChild(c)});
function check(){if(s.every((_,i)=>a[i]&&Object.keys(a[i]).length===4)){let m={낮음:1,중간:2,높음:3};let sc=s.map((_,i)=>Object.values(a[i]).reduce((t,z)=>t+m[z],0));let top=sc.indexOf(Math.max(...sc));r.innerHTML="현재 입력 기준 우선 검증 후보: <b>"+s[top][0]+"</b><br>실제 수업에서는 점수보다 근거 번호와 반증을 다시 확인하세요."}}
</script></body></html>
