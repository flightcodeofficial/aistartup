<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg2" x1="0" x2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg2)"/>
<text x="90" y="105" fill="#0F172A" font-size="56" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="900">상상 속 고객 vs 증거 기반 고객</text>
<text x="90" y="155" fill="#64748B" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">어느 쪽이 실제 메시지·채널·제안 설계에 더 유용할까요?</text>
<g transform="translate(90,220)" filter="url(#s)">
  <rect width="650" height="540" rx="38" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="80" cy="80" r="36" fill="#E2E8F0"/>
  <text x="80" y="91" text-anchor="middle" fill="#64748B" font-size="30" font-family="Arial">?</text>
  <text x="140" y="72" fill="#64748B" font-size="23" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">상상 속 고객</text>
  <text x="42" y="155" fill="#0F172A" font-size="32" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="900">“SNS를 자주 쓰는 30대 직장인”</text>
  <g fill="#475569" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif">
    <text x="42" y="235">• 어떤 문제가 있는가?</text><text x="42" y="290">• 언제 문제가 심해지는가?</text><text x="42" y="345">• 지금 무엇으로 해결하는가?</text><text x="42" y="400">• 왜 기존 방식을 바꾸려 하는가?</text><text x="42" y="455">• 돈을 쓸 만큼 심각한가?</text>
  </g>
  <rect x="42" y="485" width="566" height="1" fill="#E2E8F0"/>
  <text x="42" y="525" fill="#F43F5E" font-size="22" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">겉보기엔 구체적이지만 구매 행동은 설명하지 못함</text>
</g>
<g transform="translate(860,220)" filter="url(#s)">
  <rect width="650" height="540" rx="38" fill="#101B35"/>
  <circle cx="80" cy="80" r="36" fill="#4F46E5"/>
  <path d="M65 80l11 11 21-24" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="72" fill="#A5B4FC" font-size="23" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">증거 기반 고객</text>
  <text x="42" y="142" fill="white" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="900">“월말마다 수작업 보고서 작성에 약 4시간,</text>
  <text x="42" y="182" fill="white" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="900">팀장 보고 전 오류를 걱정하는 운영담당자”</text>
  <g font-size="22" font-family="Arial,'Noto Sans KR',sans-serif">
    <rect x="42" y="225" width="270" height="62" rx="20" fill="#16264A"/><text x="62" y="264" fill="white">반복 문제 · 수작업 보고</text>
    <rect x="330" y="225" width="270" height="62" rx="20" fill="#16264A"/><text x="350" y="264" fill="white">촉발 사건 · 월말 보고</text>
    <rect x="42" y="305" width="270" height="62" rx="20" fill="#16264A"/><text x="62" y="344" fill="white">현재 대안 · 엑셀/복붙</text>
    <rect x="330" y="305" width="270" height="62" rx="20" fill="#16264A"/><text x="350" y="344" fill="white">기대 결과 · 시간/오류↓</text>
    <rect x="42" y="385" width="558" height="62" rx="20" fill="#16264A"/><text x="62" y="424" fill="white">구매 장벽 · 변경 부담 / 데이터 보안 우려</text>
  </g>
  <text x="42" y="510" fill="#34D399" font-size="22" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">문제·상황·대안·촉발 사건이 보이면 메시지가 보인다</text>
</g>
<rect x="560" y="800" width="480" height="52" rx="26" fill="#FEF3C7"/>
<text x="800" y="833" text-anchor="middle" fill="#92400E" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">교육용 비교 사례 · 실제 시장 통계가 아님</text>
</svg>
