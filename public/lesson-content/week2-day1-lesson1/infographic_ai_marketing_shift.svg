<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#1F2A4D"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".22"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1350" cy="120" r="260" fill="#7C3AED" opacity=".08"/>
<circle cx="180" cy="820" r="280" fill="#4F46E5" opacity=".08"/>
<text x="100" y="110" fill="#A5B4FC" font-size="28" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">2026 AI MARKETING SHIFT</text>
<text x="100" y="185" fill="white" font-size="58" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">AI 활용은 기본이 되었습니다</text>
<g transform="translate(100,250)" filter="url(#shadow)">
  <rect width="430" height="460" rx="36" fill="#111A2E"/>
  <text x="42" y="78" fill="#94A3B8" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">HubSpot 2026 조사</text>
  <text x="42" y="215" fill="#7C3AED" font-size="150" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="900">61%</text>
  <text x="42" y="285" fill="white" font-size="31" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">AI가 최근 20년 중</text>
  <text x="42" y="330" fill="white" font-size="31" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">가장 큰 마케팅 변화를</text>
  <text x="42" y="375" fill="white" font-size="31" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">만들고 있다고 응답</text>
  <text x="42" y="425" fill="#64748B" font-size="19" font-family="Arial,'Noto Sans KR',sans-serif">※ 해당 조사 표본 기준</text>
</g>
<g transform="translate(590,250)">
  <text x="0" y="42" fill="#94A3B8" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">과거의 질문</text>
  <rect y="68" width="420" height="270" rx="28" fill="#141D31" stroke="#334155"/>
  <text x="30" y="130" fill="#CBD5E1" font-size="26" font-family="Arial,'Noto Sans KR',sans-serif">얼마나 많이 만들까?</text>
  <text x="30" y="186" fill="#CBD5E1" font-size="26" font-family="Arial,'Noto Sans KR',sans-serif">얼마나 빨리 만들까?</text>
  <text x="30" y="242" fill="#CBD5E1" font-size="26" font-family="Arial,'Noto Sans KR',sans-serif">몇 채널에 뿌릴까?</text>
  <line x1="25" x2="395" y1="286" y2="286" stroke="#F43F5E" stroke-width="5" opacity=".8"/>
  <text x="500" y="42" fill="#A5B4FC" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">지금의 질문</text>
  <rect x="500" y="68" width="420" height="270" rx="28" fill="#151C36" stroke="#6366F1"/>
  <text x="530" y="128" fill="white" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">어떤 고객 증거인가?</text>
  <text x="530" y="184" fill="white" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">무엇을 믿을 수 있나?</text>
  <text x="530" y="240" fill="white" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">누가 검수했는가?</text>
  <text x="530" y="296" fill="white" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">다음 행동과 연결되는가?</text>
</g>
<g transform="translate(590,635)">
  <rect width="920" height="120" rx="30" fill="url(#accent)"/>
  <text x="460" y="48" text-anchor="middle" fill="white" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">진짜 차별점</text>
  <text x="460" y="91" text-anchor="middle" fill="white" font-size="34" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">고객 이해 → 일관된 메시지 → 사람의 검수</text>
</g>
<text x="100" y="840" fill="#64748B" font-size="18" font-family="Arial,'Noto Sans KR',sans-serif">Source: HubSpot 2026 State of Marketing · 내부 딥리서치 요약</text>
</svg>
