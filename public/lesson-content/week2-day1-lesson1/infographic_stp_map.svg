<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1426"/><stop offset="1" stop-color="#111A33"/></linearGradient>
  <linearGradient id="gS" x1="0" x2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  <linearGradient id="gT" x1="0" x2="1"><stop stop-color="#6D28D9"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="gP" x1="0" x2="1"><stop stop-color="#D97706"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg3)"/>
<text x="100" y="105" fill="white" font-size="55" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="900">STP — 나누고, 선택하고, 선택 이유를 설명합니다</text>
<text x="100" y="155" fill="#94A3B8" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif">고객 증거를 마케팅 전략으로 연결하는 가장 기본적인 순서</text>
<g transform="translate(100,230)"><rect width="420" height="430" rx="34" fill="#121E36" stroke="#3B82F6" stroke-width="2"/><rect width="420" height="94" rx="34" fill="url(#gS)"/><text x="36" y="60" fill="white" font-size="38" font-family="Arial" font-weight="900">S</text><text x="88" y="60" fill="white" font-size="28" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">Segmentation · 세분화</text><text x="32" y="145" fill="white" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">비슷한 문제·상황·행동으로 나눈다</text><g fill="#CBD5E1" font-size="21" font-family="Arial,'Noto Sans KR',sans-serif"><text x="32" y="205">• 어떤 문제가 반복되는가?</text><text x="32" y="250">• 어떤 사건이 촉발하는가?</text><text x="32" y="295">• 현재 대안은 무엇인가?</text><text x="32" y="340">• 왜 구매를 미루는가?</text></g><rect x="32" y="365" width="356" height="42" rx="21" fill="#1D4ED8" opacity=".65"/><text x="210" y="393" text-anchor="middle" fill="white" font-size="19" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">산출물 · 세그먼트 후보</text></g>
<path d="M545 445h70" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><path d="M605 430l20 15-20 15" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(640,230)"><rect width="420" height="430" rx="34" fill="#121E36" stroke="#8B5CF6" stroke-width="2"/><rect width="420" height="94" rx="34" fill="url(#gT)"/><text x="36" y="60" fill="white" font-size="38" font-family="Arial" font-weight="900">T</text><text x="88" y="60" fill="white" font-size="28" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">Targeting · 타깃</text><text x="32" y="145" fill="white" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">지금 가장 먼저 검증할 고객을 고른다</text><g fill="#CBD5E1" font-size="21" font-family="Arial,'Noto Sans KR',sans-serif"><text x="32" y="205">• 문제는 얼마나 심각한가?</text><text x="32" y="250">• 이미 시간·비용을 쓰는가?</text><text x="32" y="295">• 새 해결책을 시도할 이유가 있는가?</text><text x="32" y="340">• 우리가 접근 가능한가?</text></g><rect x="32" y="365" width="356" height="42" rx="21" fill="#7C3AED" opacity=".7"/><text x="210" y="393" text-anchor="middle" fill="white" font-size="19" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">산출물 · ECP / ICP / Anti-ICP</text></g>
<path d="M1085 445h70" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><path d="M1145 430l20 15-20 15" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(1180,230)"><rect width="320" height="430" rx="34" fill="#121E36" stroke="#F59E0B" stroke-width="2"/><rect width="320" height="94" rx="34" fill="url(#gP)"/><text x="30" y="60" fill="white" font-size="38" font-family="Arial" font-weight="900">P</text><text x="82" y="60" fill="white" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">Positioning</text><text x="26" y="145" fill="white" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">왜 우리인가?</text><g fill="#CBD5E1" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif"><text x="26" y="205">• 고객의 해야 할 일</text><text x="26" y="250">• 줄여야 할 고충</text><text x="26" y="295">• 기대 결과</text><text x="26" y="340">• 현재 대안과 차이</text></g><rect x="26" y="365" width="268" height="42" rx="21" fill="#D97706" opacity=".75"/><text x="160" y="393" text-anchor="middle" fill="white" font-size="18" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">산출물 · 가치제안</text></g>
<g transform="translate(160,720)"><rect width="1280" height="92" rx="28" fill="#0F172A" stroke="#334155"/><text x="640" y="38" text-anchor="middle" fill="#94A3B8" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">DAY 1 전체 연결</text><text x="640" y="72" text-anchor="middle" fill="white" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="800">고객 증거 → 세그먼트 → ECP/ICP → 페르소나·여정 → 가치제안</text></g>
</svg>
