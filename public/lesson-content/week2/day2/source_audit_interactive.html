<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5fb;font-family:Arial,sans-serif}.wrap{width:1280px;height:720px;padding:48px 58px;background:linear-gradient(135deg,#07111f,#14233a)}h1{font-size:34px;margin:0 0 10px}.sub{font-size:18px;color:#abc0d3;margin-bottom:25px}.card{background:#12243a;border:1px solid #315675;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.btn{border:1px solid #518bb7;background:#15324d;color:#fff;border-radius:13px;padding:12px 16px;cursor:pointer;font-size:16px}.btn.active{background:#1d6288;border-color:#7bd5ff}@media(max-width:640px){.wrap{width:100%;height:auto;min-height:720px;padding:24px}.grid{grid-template-columns:1fr!important}h1{font-size:27px}}.sentence{padding:15px;border-radius:13px;background:#0e2032;margin:9px 0;border:1px solid #294660;cursor:pointer}#result{line-height:1.7;min-height:140px}</style></head><body><div class="wrap"><h1>원천문서 감사 연습</h1><div class="sub">문장을 선택하고 가장 안전한 분류를 골라보세요.</div><div class="grid"><div class="card"><div class="sentence" data-t="고객">“매일 SNS에 뭘 올릴지 모르겠어요.”</div><div class="sentence" data-t="확인">우리 서비스는 모든 카페의 매출을 올린다.</div><div class="sentence" data-t="경험">창업자인 나는 매주 다음 주 게시물 주제를 미리 정리해왔다.</div><div class="sentence" data-t="확인">사용자는 평균 40% 시간을 절약한다.</div></div><div class="card"><div id="picked">왼쪽 문장을 선택하세요.</div><p><button class="btn" data-k="고객">고객 직접 표현</button> <button class="btn" data-k="경험">창업자 경험</button> <button class="btn" data-k="확인">확인 필요</button></p><div id="result">모르면 ‘확인 필요’로 남기는 것이 안전합니다.</div></div></div></div><script>let ans='';document.querySelectorAll('.sentence').forEach(x=>x.onclick=()=>{ans=x.dataset.t;picked.textContent=x.textContent});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{result.textContent=b.dataset.k===ans?'좋습니다. 출처와 역할을 구분했습니다.':'다시 확인하세요. 고객의 말, 창업자의 경험, 확인되지 않은 주장을 섞지 않습니다.'})</script></body></html>
