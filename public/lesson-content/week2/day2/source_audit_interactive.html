<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5fb;font-family:Arial,sans-serif}.wrap{width:1280px;height:720px;padding:48px 58px;background:linear-gradient(135deg,#07111f,#14233a)}h1{font-size:34px;margin:0 0 10px}.sub{font-size:18px;color:#abc0d3;margin-bottom:25px}.card{background:#12243a;border:1px solid #315675;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.btn{border:1px solid #518bb7;background:#15324d;color:#fff;border-radius:13px;padding:12px 16px;cursor:pointer;font-size:16px}.btn.active{background:#1d6288;border-color:#7bd5ff}@media(max-width:640px){.wrap{width:100%;height:auto;min-height:720px;padding:24px}.grid{grid-template-columns:1fr!important}h1{font-size:27px}}.sentence{padding:15px;border-radius:13px;background:#0e2032;margin:9px 0;border:1px solid #294660;cursor:pointer}#result{line-height:1.7;min-height:140px}</style></head><body><div class="wrap"><h1>원천문서 판정 연습</h1><div class="sub">문장을 선택하고 근거상태를 골라보세요.</div><div class="grid"><div class="card"><div class="sentence" data-t="근거있음">고객이 "사진은 많은데 어떤 글을 써야 할지 모르겠다"고 말했다.</div><div class="sentence" data-t="검증필요">우리 서비스를 쓰면 매출이 3배 증가한다.</div><div class="sentence" data-t="근거있음">여러 카페 사장님과 상담하면서 콘텐츠 아이디어를 어려워하는 경우를 반복적으로 봤다.</div><div class="sentence" data-t="추론">이 문제를 겪는 사장님이 아마 대부분일 것이다.</div></div><div class="card"><div id="picked">왼쪽 문장을 선택하세요.</div><p><button class="btn" data-k="근거있음">🟢 근거 있음</button> <button class="btn" data-k="추론">🔵 추론</button> <button class="btn" data-k="검증필요">🔴 검증 필요</button></p><div id="result">모르면 '검증 필요'로 남기는 것이 안전합니다.</div></div></div></div><script>let ans='';document.querySelectorAll('.sentence').forEach(x=>x.onclick=()=>{ans=x.dataset.t;picked.textContent=x.textContent});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{result.textContent=b.dataset.k===ans?'좋습니다. 근거상태를 정확히 구분했습니다.':'다시 확인하세요. 실제 자료로 뒷받침되면 근거 있음, 합리적 추측이면 추론, 출처가 없으면 검증 필요입니다.'})</script></body></html>
