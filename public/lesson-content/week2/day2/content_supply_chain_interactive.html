<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5fb;font-family:Arial,sans-serif}.wrap{width:1280px;height:720px;padding:48px 58px;background:linear-gradient(135deg,#07111f,#14233a)}h1{font-size:34px;margin:0 0 10px}.sub{font-size:18px;color:#abc0d3;margin-bottom:25px}.card{background:#12243a;border:1px solid #315675;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.btn{border:1px solid #518bb7;background:#15324d;color:#fff;border-radius:13px;padding:12px 16px;cursor:pointer;font-size:16px}.btn.active{background:#1d6288;border-color:#7bd5ff}@media(max-width:640px){.wrap{width:100%;height:auto;min-height:720px;padding:24px}.grid{grid-template-columns:1fr!important}h1{font-size:27px}}.row{display:grid;grid-template-columns:220px 80px 220px 80px 260px;gap:12px;align-items:center;margin:80px 0}.node{padding:22px;border-radius:18px;background:#12273d;border:1px solid #31577a;text-align:center;font-size:18px}.arr{text-align:center;color:#69c9f5;font-size:28px}</style></head><body><div class="wrap"><h1>콘텐츠 공급망</h1><div class="sub">채널이 바뀌어도 사람 검수는 사라지지 않습니다.</div><p><button class="btn active" data-c="SNS">SNS</button> <button class="btn" data-c="블로그">블로그</button> <button class="btn" data-c="뉴스레터">뉴스레터</button></p><div class="row"><div class="node">승인된 원천문서</div><div class="arr">→</div><div class="node" id="ch">SNS 초안</div><div class="arr">→</div><div class="node">사람 검수<br>사실·브랜드·저작권</div></div></div><script>document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('active'));b.classList.add('active');ch.textContent=b.dataset.c+' 초안'})</script></body></html>
