<g font-family="Arial,sans-serif"><rect x="80" y="180" width="340" height="405" rx="26" fill="#162d46" stroke="#59b6ef"/><text x="115" y="235" font-size="26" fill="#fff" font-weight="700">Instagram</text><text x="115" y="278" font-size="17" fill="#b5cce0">빠른 탐색 · 시각 소비</text><text x="115" y="330" font-size="18" fill="#fff">훅 → 공감 상황</text><text x="115" y="368" font-size="18" fill="#fff">→ 핵심 3가지</text><text x="115" y="406" font-size="18" fill="#fff">→ 근거/한계</text><text x="115" y="444" font-size="18" fill="#fff">→ CTA 하나</text>
<rect x="470" y="180" width="340" height="405" rx="26" fill="#173b3f" stroke="#55d5c1"/><text x="505" y="235" font-size="26" fill="#fff" font-weight="700">LinkedIn</text><text x="505" y="278" font-size="17" fill="#bee1dc">업무 관점 · 경험 공유</text><text x="505" y="330" font-size="18" fill="#fff">관찰 → 경험</text><text x="505" y="368" font-size="18" fill="#fff">→ 배운 점</text><text x="505" y="406" font-size="18" fill="#fff">→ 적용 범위</text><text x="505" y="444" font-size="18" fill="#fff">→ 질문 CTA</text>
<rect x="860" y="180" width="340" height="405" rx="26" fill="#3b301c" stroke="#efc15a"/><text x="895" y="235" font-size="26" fill="#fff" font-weight="700">Threads</text><text x="895" y="278" font-size="17" fill="#efe0b7">짧은 관찰 · 대화</text><text x="895" y="330" font-size="18" fill="#fff">한 문장 관찰</text><text x="895" y="368" font-size="18" fill="#fff">→ 이유 1~2개</text><text x="895" y="406" font-size="18" fill="#fff">→ 짧은 예시</text><text x="895" y="444" font-size="18" fill="#fff">→ 대화형 질문</text></g></svg>