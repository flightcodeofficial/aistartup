<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#14233a"/></linearGradient></defs>
<rect width="1280" height="720" rx="32" fill="url(#g)"/>
<text x="72" y="82" font-family="Arial,sans-serif" font-size="24" fill="#70d6ff" font-weight="700">BLOG vs NEWSLETTER</text>
<text x="72" y="123" font-family="Arial,sans-serif" font-size="18" fill="#b7c7d8">장문이어도 읽는 이유와 관계가 다릅니다</text>
<g font-family="Arial,sans-serif"><rect x="85" y="180" width="520" height="410" rx="28" fill="#152e47" stroke="#58b7f0"/><text x="125" y="238" font-size="28" fill="#fff" font-weight="700">BLOG</text><text x="125" y="282" font-size="18" fill="#b8cfe2">검색하고 비교하는 독자</text><text x="125" y="345" font-size="20" fill="#fff">문제 → 관찰 → 방법</text><text x="125" y="385" font-size="20" fill="#fff">→ 근거 → 한계 → CTA</text><text x="125" y="475" font-size="18" fill="#c7d7e5">“이 글이 내 문제 해결에</text><text x="125" y="508" font-size="18" fill="#c7d7e5">실제로 도움이 되는가?”</text>
<rect x="675" y="180" width="520" height="410" rx="28" fill="#173b3f" stroke="#57d7c4"/><text x="715" y="238" font-size="28" fill="#fff" font-weight="700">NEWSLETTER</text><text x="715" y="282" font-size="18" fill="#c0e3de">이미 관계가 있는 구독자</text><text x="715" y="345" font-size="20" fill="#fff">개인적 도입 → 통찰</text><text x="715" y="385" font-size="20" fill="#fff">→ 적용법 → CTA</text><text x="715" y="475" font-size="18" fill="#cee3df">“왜 지금 이 이야기를</text><text x="715" y="508" font-size="18" fill="#cee3df">나에게 보내는가?”</text></g></svg>