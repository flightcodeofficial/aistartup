<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5fb;font-family:Arial,sans-serif}.wrap{width:1280px;height:720px;padding:48px 58px;background:linear-gradient(135deg,#07111f,#14233a)}h1{font-size:34px;margin:0 0 10px}.sub{font-size:18px;color:#abc0d3;margin-bottom:25px}.card{background:#12243a;border:1px solid #315675;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.btn{border:1px solid #518bb7;background:#15324d;color:#fff;border-radius:13px;padding:12px 16px;cursor:pointer;font-size:16px}.btn.active{background:#1d6288;border-color:#7bd5ff}@media(max-width:640px){.wrap{width:100%;height:auto;min-height:720px;padding:24px}.grid{grid-template-columns:1fr!important}h1{font-size:27px}}.tabs{display:flex;gap:10px;margin:22px 0}#structure{font-size:22px;line-height:1.7}</style></head><body><div class="wrap"><h1>같은 메시지, 다른 채널</h1><div class="sub">채널이 바뀌어도 사실은 바뀌지 않습니다.</div><div class="tabs"><button class="btn active" data-k="ig">Instagram</button><button class="btn" data-k="li">LinkedIn</button><button class="btn" data-k="th">Threads</button></div><div class="grid"><div class="card"><h2>변하지 않는 것</h2><p>대상 고객 · 문제 · 확인된 가치 · 근거</p></div><div class="card"><h2 id="title">Instagram 구조</h2><div id="structure">훅 → 공감 상황 → 핵심 3가지 → 근거/한계 → CTA</div></div></div></div><script>const d={ig:['Instagram 구조','훅 → 공감 상황 → 핵심 3가지 → 근거/한계 → CTA'],li:['LinkedIn 구조','업무 관찰 → 실제 경험 → 배운 점 → 적용 범위 → 질문 CTA'],th:['Threads 구조','한 문장 관찰 → 이유 1~2개 → 짧은 예시 → 대화형 질문']};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-k]').forEach(x=>x.classList.remove('active'));b.classList.add('active');let x=d[b.dataset.k];title.textContent=x[0];structure.textContent=x[1]})</script></body></html>
