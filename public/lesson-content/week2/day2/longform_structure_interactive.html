<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5fb;font-family:Arial,sans-serif}.wrap{width:1280px;height:720px;padding:48px 58px;background:linear-gradient(135deg,#07111f,#14233a)}h1{font-size:34px;margin:0 0 10px}.sub{font-size:18px;color:#abc0d3;margin-bottom:25px}.card{background:#12243a;border:1px solid #315675;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.btn{border:1px solid #518bb7;background:#15324d;color:#fff;border-radius:13px;padding:12px 16px;cursor:pointer;font-size:16px}.btn.active{background:#1d6288;border-color:#7bd5ff}@media(max-width:640px){.wrap{width:100%;height:auto;min-height:720px;padding:24px}.grid{grid-template-columns:1fr!important}h1{font-size:27px}}.tabs{display:flex;gap:10px;margin:22px 0}#steps{font-size:21px;line-height:1.7}</style></head><body><div class="wrap"><h1>블로그와 뉴스레터는 같은 긴 글이 아닙니다</h1><div class="sub">읽는 맥락이 바뀌면 구조도 바뀝니다.</div><div class="tabs"><button class="btn active" data-k="blog">블로그</button><button class="btn" data-k="news">뉴스레터</button></div><div class="grid"><div class="card"><h2 id="who">검색하고 비교하는 독자</h2><div id="steps">문제 → 관찰 → 방법 → 근거 → 한계 → CTA</div></div><div class="card"><h2>핵심 질문</h2><p id="why">“이 글이 내 문제 해결에 실제로 도움이 되는가?”</p></div></div></div><script>const d={blog:['검색하고 비교하는 독자','문제 → 관찰 → 방법 → 근거 → 한계 → CTA','“이 글이 내 문제 해결에 실제로 도움이 되는가?”'],news:['이미 관계가 있는 구독자','개인적 도입 → 핵심 통찰 → 적용법 → CTA','“왜 지금 이 이야기를 나에게 보내는가?”']};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-k]').forEach(x=>x.classList.remove('active'));b.classList.add('active');let x=d[b.dataset.k];who.textContent=x[0];steps.textContent=x[1];why.textContent=x[2]})</script></body></html>
