<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#f7f8fb"/><text x="60" y="90" font-family="Arial" font-size="38" font-weight="700" fill="#172033">고객 응대 시나리오와 이관 기준 설계</text><text x="60" y="138" font-family="Arial" font-size="20" fill="#667085">실습 전에 구조를 한눈에 정리합니다.</text><g font-family="Arial"><rect x="60" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="84" y="265" font-size="24" font-weight="700" fill="#172033">핵심 1</text><text x="84" y="315" font-size="18" fill="#536079">구매 전 / 사용법 / 일정 /</text><text x="84" y="349" font-size="18" fill="#536079">불만 / 환불 / 개인정보</text><rect x="445" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="469" y="265" font-size="24" font-weight="700" fill="#172033">핵심 2</text><text x="469" y="315" font-size="18" fill="#536079">무엇을 묻는지 재확인</text><rect x="830" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="854" y="265" font-size="24" font-weight="700" fill="#172033">핵심 3</text><text x="854" y="315" font-size="18" fill="#536079">꼭 필요한 정보 1~2개</text></g></svg>