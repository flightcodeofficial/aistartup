<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT로 FAQ 초안 만들고 Notion에 정리 인터랙티브</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f8fb;color:#172033}.wrap{width:1280px;height:720px;padding:48px;display:flex;gap:32px}.left{width:46%}h1{font-size:42px;line-height:1.15;margin:0 0 14px}p{font-size:20px;color:#536079}.grid{display:grid;gap:14px;margin-top:26px}.card{text-align:left;border:1px solid #dce2ec;background:white;border-radius:18px;padding:18px;cursor:pointer}.card b{display:block;font-size:20px;margin-bottom:6px}.card span{font-size:15px;color:#667085}.panel{flex:1;background:#111827;color:white;border-radius:26px;padding:34px;display:flex;flex-direction:column;justify-content:center}.panel h2{font-size:34px;margin:0 0 14px}.panel div{font-size:22px;line-height:1.55;color:#dbe4f0}@media(max-width:900px){.wrap{width:100%;height:auto;min-height:100vh;display:block;padding:24px}.left{width:100%}.panel{margin-top:20px;min-height:300px}}</style></head><body><main class="wrap"><section class="left"><h1>ChatGPT로 FAQ 초안 만들고 Notion에 정리 인터랙티브</h1><p>카드를 눌러 핵심 포인트를 비교해보세요.</p><div class="grid"><button class="card" onclick="show(0)"><b>좋은 방향</b><span>고객 자료와 확인된 사실을 기준으로 판단합니다.</span></button><button class="card" onclick="show(1)"><b>주의할 방향</b><span>근거 없는 추측·과장·자동 발송을 피합니다.</span></button><button class="card" onclick="show(2)"><b>실습 포인트</b><span>한 번에 한 단계씩 만들고 사람이 최종 확인합니다.</span></button></div></section><section class="panel"><h2 id="t">선택해보세요</h2><div id="b">왼쪽 카드를 누르면 설명이 나타납니다.</div></section></main><script>const items=[{"title": "좋은 방향", "body": "고객 자료와 확인된 사실을 기준으로 판단합니다."}, {"title": "주의할 방향", "body": "근거 없는 추측·과장·자동 발송을 피합니다."}, {"title": "실습 포인트", "body": "한 번에 한 단계씩 만들고 사람이 최종 확인합니다."}];function show(i){document.getElementById('t').textContent=items[i].title;document.getElementById('b').textContent=items[i].body;}</script></body></html>
