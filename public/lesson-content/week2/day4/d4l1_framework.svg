<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#f7f8fb"/><text x="60" y="90" font-family="Arial" font-size="38" font-weight="700" fill="#172033">한 페이지 랜딩 구조 설계</text><text x="60" y="138" font-family="Arial" font-size="20" fill="#667085">실습 전에 구조를 한눈에 정리합니다.</text><g font-family="Arial"><rect x="60" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="84" y="265" font-size="24" font-weight="700" fill="#172033">핵심 1</text><text x="84" y="315" font-size="18" fill="#536079">Hero → 문제 → 해결 → 근거</text><text x="84" y="349" font-size="18" fill="#536079">→ CTA → FAQ</text><rect x="445" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="469" y="265" font-size="24" font-weight="700" fill="#172033">핵심 2</text><text x="469" y="315" font-size="18" fill="#536079">누구 / 무엇 / 다음 행동</text><rect x="830" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="854" y="265" font-size="24" font-weight="700" fill="#172033">핵심 3</text><text x="854" y="315" font-size="18" fill="#536079">고객 자료에서 반복된 실제 문제</text><text x="854" y="349" font-size="18" fill="#536079">2~3개</text></g></svg>