<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#f7f8fb"/><text x="60" y="90" font-family="Arial" font-size="38" font-weight="700" fill="#172033">Tally 문의·신청 폼과 동의 설계</text><text x="60" y="138" font-family="Arial" font-size="20" fill="#667085">실습 전에 구조를 한눈에 정리합니다.</text><g font-family="Arial"><rect x="60" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="84" y="265" font-size="24" font-weight="700" fill="#172033">핵심 1</text><text x="84" y="315" font-size="18" fill="#536079">연락에 꼭 필요한 것만 필수</text><rect x="445" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="469" y="265" font-size="24" font-weight="700" fill="#172033">핵심 2</text><text x="469" y="315" font-size="18" fill="#536079">초기 검증은 제출 장벽 낮추기</text><rect x="830" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="854" y="265" font-size="24" font-weight="700" fill="#172033">핵심 3</text><text x="854" y="315" font-size="18" fill="#536079">수집 목적·항목·보유 안내를 실제</text><text x="854" y="349" font-size="18" fill="#536079">운영에 맞게</text></g></svg>