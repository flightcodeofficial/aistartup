<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#f7f8fb"/><text x="60" y="90" font-family="Arial" font-size="38" font-weight="700" fill="#172033">개인화 이메일·DM 초안 만들기</text><text x="60" y="138" font-family="Arial" font-size="20" fill="#667085">실습 전에 구조를 한눈에 정리합니다.</text><g font-family="Arial"><rect x="60" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="84" y="265" font-size="24" font-weight="700" fill="#172033">핵심 1</text><text x="84" y="315" font-size="18" fill="#536079">확인된 맥락 / 연락 이유 / 다음</text><text x="84" y="349" font-size="18" fill="#536079">행동</text><rect x="445" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="469" y="265" font-size="24" font-weight="700" fill="#172033">핵심 2</text><text x="469" y="315" font-size="18" fill="#536079">민감정보 추정 / 사생활 추측 /</text><text x="469" y="349" font-size="18" fill="#536079">가짜 친밀감</text><rect x="830" y="210" width="350" height="330" rx="24" fill="#fff" stroke="#dbe2ea"/><text x="854" y="265" font-size="24" font-weight="700" fill="#172033">핵심 3</text><text x="854" y="315" font-size="18" fill="#536079">왜 나에게 보냈는지 바로 이해</text></g></svg>