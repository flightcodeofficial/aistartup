<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객 원문 태깅 연습</title><style>:root{--bg:#07111f;--panel:#0f1b2d;--line:#26364e;--text:#f8fafc;--muted:#9fb0c7}*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;background:linear-gradient(135deg,#07111f,#101b31);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text);overflow:hidden}.wrap{padding:40px 50px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.top h1{margin:0;font-size:34px}.top p{margin:7px 0 0;color:var(--muted);font-size:17px}.score{color:#cbd5e1;font-weight:700}.grid{display:grid;grid-template-columns:1.06fr .94fr;gap:24px}.card{background:rgba(15,27,45,.94);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.22)}.quote{padding:30px}.label{font-size:13px;letter-spacing:.12em;color:#93c5fd;font-weight:700}.quoteText{font-size:27px;line-height:1.55;margin:18px 0 24px;font-weight:700}.tip{background:#0b1525;border-radius:15px;padding:14px 16px;color:#cbd5e1;font-size:15px;line-height:1.5}.right{padding:24px}.right h2{font-size:20px;margin:0 0 14px}.tag{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center;margin:9px 0}.tag span{font-size:15px;color:#cbd5e1}.choices{display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #3b4d67;background:#132239;color:#e5edf8;border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer}button:hover{border-color:#60a5fa}.correct{background:#064e3b!important;border-color:#34d399!important}.wrong{background:#5f1d2c!important;border-color:#f87171!important}.feedback{height:68px;margin-top:15px;border-top:1px solid var(--line);padding-top:14px;color:#cbd5e1;font-size:15px;line-height:1.45}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.next{padding:10px 18px;background:#2563eb;border-color:#3b82f6;font-weight:700}.next:disabled{opacity:.35;cursor:not-allowed}.progress{height:6px;background:#1f2937;border-radius:999px;margin-top:17px;overflow:hidden}.progress i{display:block;height:100%;background:#3b82f6;width:0}.legend{display:flex;gap:16px;font-size:13px;color:#9fb0c7;margin-top:18px}.legend b{color:#e2e8f0}</style></head><body><div class="wrap"><div class="top"><div><h1>한 문장에서 무엇을 읽어낼 수 있을까요?</h1><p>원문에 없는 정보는 억지로 채우지 말고 <b>검증 필요</b>로 남깁니다.</p></div><div class="score" id="score">0 / 4 완료</div></div><div class="grid"><section class="card quote"><div class="label" id="source"></div><div class="quoteText" id="quote"></div><div class="tip"><b>판단 기준</b><br>원문에 직접 있으면 ‘근거 있음’, 문맥상 가능하지만 직접 말하지 않았으면 ‘추론’, 확인할 수 없으면 ‘검증 필요’입니다.</div><div class="legend"><span><b>근거 있음</b> 직접 확인</span><span><b>추론</b> 합리적 해석</span><span><b>검증 필요</b> 원문에 없음</span></div></section><section class="card right"><h2>각 항목의 상태를 고르세요</h2><div id="tags"></div><div class="feedback" id="feedback">모든 항목을 선택하면 바로 피드백이 나옵니다.</div><div class="actions"><span id="hint">0 / 4 선택</span><button class="next" id="next" disabled>다음 문장</button></div><div class="progress"><i id="bar"></i></div></section></div></div><script>
const items=[
{source:"연습 1 · 공개 리뷰 예시",quote:"행사 전날이 되면 게시물이 비어 있어서 급하게 Canva 템플릿을 찾아요.",tags:[["고객 상황","근거 있음"],["문제","근거 있음"],["현재 대안","근거 있음"],["기대 결과","검증 필요"]],explain:"행사 전날·게시물 미준비·Canva 탐색은 직접 확인됩니다. 원하는 최종 결과는 말하지 않았으므로 검증이 필요합니다."},
{source:"연습 2 · 인터뷰 예시",quote:"외주를 맡기면 편하지만 수정 요청을 여러 번 해야 해서 결국 제가 다시 손보는 경우가 많아요.",tags:[["현재 대안","근거 있음"],["문제","근거 있음"],["수정 부담 감소 욕구","추론"],["촉발 사건","검증 필요"]],explain:"외주와 반복 수정은 직접 근거입니다. 수정 부담을 줄이고 싶다는 욕구는 합리적 추론이지만 직접 발언은 아닙니다."},
{source:"연습 3 · 문의 예시",quote:"월말 보고 전에 여러 파일을 합치는데 숫자가 틀릴까 봐 마지막에 다시 확인합니다.",tags:[["고객 상황","근거 있음"],["현재 대안","근거 있음"],["오류에 대한 불안","근거 있음"],["구매 예산","검증 필요"]],explain:"월말·파일 취합·오류 걱정은 원문에 있습니다. 구매 예산은 전혀 언급되지 않았습니다."},
{source:"연습 4 · 커뮤니티 예시",quote:"새 툴을 배우는 데 시간이 너무 걸리면 그냥 지금 방식으로 계속 할 것 같아요.",tags:[["반대 이유","근거 있음"],["현재 대안 유지","추론"],["학습 부담","근거 있음"],["회사 규모","검증 필요"]],explain:"학습 시간 부담은 직접 근거입니다. 기존 방식을 유지할 가능성은 문장상 추론할 수 있지만 회사 규모는 알 수 없습니다."}
];
const states=["근거 있음","추론","검증 필요"];let idx=0,answers={};const q=document.getElementById("quote"),source=document.getElementById("source"),tags=document.getElementById("tags"),fb=document.getElementById("feedback"),next=document.getElementById("next"),hint=document.getElementById("hint"),score=document.getElementById("score"),bar=document.getElementById("bar");
function render(){answers={};const it=items[idx];q.textContent='“'+it.quote+'”';source.textContent=it.source;tags.innerHTML='';it.tags.forEach(([label,correct],i)=>{const row=document.createElement('div');row.className='tag';const l=document.createElement('span');l.textContent=label;row.appendChild(l);const cs=document.createElement('div');cs.className='choices';states.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>choose(i,s,b,correct);cs.appendChild(b)});row.appendChild(cs);tags.appendChild(row)});fb.textContent='모든 항목을 선택하면 바로 피드백이 나옵니다.';hint.textContent='0 / 4 선택';next.disabled=true;next.textContent=idx===items.length-1?'다시 풀기':'다음 문장';score.textContent=idx+' / '+items.length+' 완료';bar.style.width=(idx/items.length*100)+'%'}
function choose(i,s,button,correct){const row=button.parentElement;[...row.children].forEach(x=>x.className='');answers[i]=s;button.className=s===correct?'correct':'wrong';[...row.children].forEach(x=>{if(x.textContent===correct&&x!==button)x.className='correct'});const count=Object.keys(answers).length;hint.textContent=count+' / 4 선택';if(count===4){fb.textContent=items[idx].explain;next.disabled=false;score.textContent=(idx+1)+' / '+items.length+' 완료';bar.style.width=((idx+1)/items.length*100)+'%'}}
next.onclick=()=>{idx=idx===items.length-1?0:idx+1;render()};render();
</script></body></html>
