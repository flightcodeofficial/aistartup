<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter></defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="84" fill="#111827" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="38" font-weight="700">좋은 AI 분석은 원문까지 되돌아갈 수 있습니다</text>
  <text x="70" y="128" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20">Insight → Evidence ID → Original Text → Counter-evidence</text>
  <g filter="url(#sh)"><rect x="70" y="190" width="260" height="170" rx="24" fill="#fff"/><rect x="360" y="190" width="260" height="170" rx="24" fill="#fff"/><rect x="650" y="190" width="260" height="170" rx="24" fill="#fff"/><rect x="940" y="190" width="270" height="170" rx="24" fill="#fff"/></g>
  <circle cx="115" cy="235" r="24" fill="#dbeafe"/><text x="115" y="243" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="20" font-weight="700">1</text><text x="102" y="290" fill="#0f172a" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700">AI 인사이트</text><text x="102" y="325" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">“콘텐츠 제작 시간이</text><text x="102" y="348" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">부족하다는 문제가 반복됨”</text>
  <circle cx="405" cy="235" r="24" fill="#ede9fe"/><text x="405" y="243" text-anchor="middle" fill="#6d28d9" font-family="Arial" font-size="20" font-weight="700">2</text><text x="392" y="290" fill="#0f172a" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700">근거 번호</text><text x="392" y="326" fill="#6d28d9" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700">리뷰-03 · 문의-02</text><text x="392" y="351" fill="#6d28d9" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700">인터뷰-04</text>
  <circle cx="695" cy="235" r="24" fill="#dcfce7"/><text x="695" y="243" text-anchor="middle" fill="#15803d" font-family="Arial" font-size="20" font-weight="700">3</text><text x="682" y="290" fill="#0f172a" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700">실제 원문</text><text x="682" y="325" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">AI 요약을 믿지 않고</text><text x="682" y="348" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">원문 의미를 다시 확인</text>
  <circle cx="985" cy="235" r="24" fill="#fee2e2"/><text x="985" y="243" text-anchor="middle" fill="#b91c1c" font-family="Arial" font-size="20" font-weight="700">4</text><text x="972" y="290" fill="#0f172a" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700">반증 확인</text><text x="972" y="325" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">다른 고객은 같은가?</text><text x="972" y="348" fill="#64748b" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">반대되는 자료를 삭제하지 않음</text>
  <path d="M330 275 H350" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><path d="M620 275 H640" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><path d="M910 275 H930" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <rect x="70" y="410" width="1140" height="210" rx="28" fill="#0f172a"/>
  <text x="105" y="458" fill="#f8fafc" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700">잘못된 요약</text><text x="105" y="500" fill="#cbd5e1" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">“고객들은 콘텐츠 제작 시간이 부족하다.”</text><text x="105" y="540" fill="#fca5a5" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">누가 · 몇 건에서 · 어떤 원문으로 말했는지 추적할 수 없음</text>
  <line x1="615" y1="445" x2="615" y2="585" stroke="#334155"/>
  <text x="660" y="458" fill="#f8fafc" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700">검증 가능한 요약</text><text x="660" y="500" fill="#cbd5e1" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">반복 문제: 콘텐츠 제작 시간이 오래 걸림</text><text x="660" y="532" fill="#93c5fd" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">근거: 리뷰-03 · 문의-02 · 인터뷰-04</text><text x="660" y="564" fill="#fca5a5" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">반증: 리뷰-08은 “시간보다 아이디어 부족”을 언급</text>
  <text x="640" y="675" text-anchor="middle" fill="#1e3a8a" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700">AI의 답을 믿는 대신, AI가 가리킨 원문을 확인합니다.</text>
</svg>
